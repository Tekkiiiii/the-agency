- id: VI-HUM-D04
  name: meta-dan-duong
  skill: humanizer-vi
  category: discourse
  finding_type: preference
  scope: paragraph
  aggregation: count
  severity: medium
  confidence: medium
  summary: Chèn nhãn điều hướng giữa bài như "Dưới đây là", "như đã đề cập ở trên", "Đây là lúc X phát
    huy tác dụng".
  signals:
    regex:
    - \bDưới đây là\b
    - \bnhư đã (?:đề cập|nói|nêu) (?:ở trên|trước đó)\b
    - \bBây giờ chúng ta đã [^.!?\n]{0,60}, hãy cùng\b
    - \b[Tt]rong phần này,? (?:chúng ta|tôi) sẽ\b
    - \bĐây là lúc\b[^.!?\n]{0,40}\bphát huy tác dụng\b
    exclude_phrases:
    - trong bài viết này
  why_it_matters: Nhãn điều hướng lặp lại điều mà heading đã nói và ngầm coi người đọc không nhớ nổi đoạn
    vừa đọc.
  rewrite_strategy:
  - Bỏ nhãn và để nội dung tự nối; heading đã làm nhiệm vụ điều hướng.
  - Nếu cần liên kết hai phần, dùng một mệnh đề nói về nội dung chứ không nói về bài viết.
  bad_examples:
  - text: Như đã đề cập ở trên, cache giảm số lần truy cập nguồn. Dưới đây là ba cách cấu hình.
    reason: Hai nhãn điều hướng liền nhau giữa thân bài.
  - text: Bây giờ chúng ta đã thảo luận về chi phí, hãy cùng xem xét thời gian triển khai.
    reason: Câu chỉ thông báo việc chuyển mục.
  good_examples:
  - mode: clean_rewrite
    text: Cache giảm số lần truy cập nguồn, và có ba cách cấu hình.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  - mode: clean_rewrite
    text: Thời gian triển khai phụ thuộc vào cùng những ràng buộc chi phí vừa nêu.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  exceptions:
  - Câu mở bài dạng "trong bài viết này" thuộc VI-HUM-D01; pattern này chỉ áp dụng cho phần thân bài.
  - Trong tài liệu kỹ thuật dài, syllabus hoặc runbook khi người đọc cần được dẫn giữa các phần.
  false_positive_risk: medium
  tags:
  - meta
  - dan-duong
  - than-bai
  min_occurrences: 1
