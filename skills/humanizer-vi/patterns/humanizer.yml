  - mode: review_comment
    text: Cần nêu thay đổi cụ thể và tác động dự kiến trước khi gọi đây là thay đổi "mang tính chuyển
      đổi".
    reason: Không xóa đánh giá của tác giả khi văn bản chưa có căn cứ.
  exceptions:
  - Trong register marketing và sản phẩm khi lời khen đi kèm bằng chứng hoặc số liệu ngay sau đó.
  - Khi "then chốt" hoặc "liền mạch" là thuật ngữ kỹ thuật đã được định nghĩa trong tài liệu.
