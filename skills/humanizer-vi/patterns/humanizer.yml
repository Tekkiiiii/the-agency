    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  exceptions:
  - Trong tài liệu giảng dạy và giáo trình khi tóm tắt cuối mục là phương pháp sư phạm có chủ đích.
  - Trong tài liệu tra cứu dài, báo cáo nhiều chương hoặc chuẩn kỹ thuật khi mỗi mục cần đọc độc lập.
