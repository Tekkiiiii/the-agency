- id: VI-HUM-L09
  name: chi-dinh-calque-day-dac
  skill: humanizer-vi
  category: lexical
  finding_type: heuristic
  scope: paragraph
  aggregation: density
  severity: low
  confidence: low
  summary: Các từ chỉ định "điều này", "việc này", "bởi" lặp dày do dịch sát ngữ pháp tiếng Anh.
  signals:
    regex:
    - \b(?:điều này|việc này|bởi)\b
  why_it_matters: Khi "this", "that", "by" được chuyển máy móc thành "điều này", "việc này", "bởi", mật
    độ các từ này cao bất thường so với văn bản do người Việt viết.
  rewrite_strategy:
  - Thay từ chỉ định bằng danh từ mà nó đang trỏ tới, hoặc gộp câu để bỏ hẳn từ chỉ định.
  - Chỉ xử lý mật độ; nếu cả đoạn còn giữ trật tự câu tiếng Anh thì chuyển sang translationese-cleaner-vi.
  bad_examples:
  - text: Hệ thống ghi log. Điều này giúp truy vết. Việc này cũng giúp cảnh báo sớm. Điều này được thực
      hiện bởi một tiến trình nền.
    reason: Bốn từ chỉ định calque trong bốn câu liên tiếp.
  - text: Báo cáo được duyệt bởi trưởng nhóm. Điều này bảo đảm tính chính xác. Việc này diễn ra hằng tuần.
    reason: '"Bởi" và chuỗi "điều này/việc này" đến từ trật tự câu tiếng Anh.'
  good_examples:
  - mode: clean_rewrite
    text: Một tiến trình nền ghi log, giúp truy vết và cảnh báo sớm.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  - mode: clean_rewrite
    text: Trưởng nhóm duyệt báo cáo hằng tuần để bảo đảm tính chính xác.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  exceptions:
  - Việc tái cấu trúc sâu trật tự từ theo tiếng Anh thuộc translationese-cleaner-vi; pattern này chỉ đánh
    dấu mật độ và định tuyến sang skill đó.
  - Trong văn bản pháp lý hoặc quy trình khi "điều này" trỏ tới một điều khoản đã đánh số.
