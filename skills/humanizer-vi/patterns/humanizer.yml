  rewrite_strategy:
  - Thay tính từ bằng đặc tính, con số hoặc kết quả đã có trong đầu vào.
  - Nếu văn bản chưa có căn cứ, giữ lập trường của tác giả và đánh dấu cần bổ sung bằng chứng.
  bad_examples:
  - text: Nền tảng có khả năng đồng bộ mạnh mẽ và tích hợp liền mạch với hệ thống hiện tại.
    reason: Hai tính từ khen trong một câu, không có thước đo nào.
  - text: Đây là một thay đổi mang tính chuyển đổi và giữ vai trò then chốt cho quý sau.
    reason: Giọng quảng cáo thay cho mô tả thay đổi cụ thể.
  good_examples:
  - mode: clean_rewrite
    text: Nền tảng đồng bộ với hệ thống hiện tại qua API sẵn có, không cần cấu hình thêm.
