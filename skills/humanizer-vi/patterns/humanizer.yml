    - \bTrong tương lai,[^.!?\n]{0,60}\bcó thể sẽ\b
  why_it_matters: Đây là đoạn cuối của khuôn năm đoạn mà mô hình hay sinh ra; nó không thêm dữ kiện, không
    nêu bước tiếp theo và làm điểm dừng bị nhòe.
  rewrite_strategy:
  - Kết ở thông tin cuối cùng có thật, hoặc nêu một bước tiếp theo có mốc thời gian.
  - Nếu muốn giữ dự báo, gắn nó với một điều kiện hoặc nguồn cụ thể.
  bad_examples:
