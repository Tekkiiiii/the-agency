- id: VI-HUM-S05
  name: doan-dai-dong-deu
  skill: humanizer-vi
  category: structural
  finding_type: heuristic
  scope: document
  aggregation: variance
  severity: low
  confidence: low
  summary: Bốn đoạn trở lên có độ dài gần bằng nhau, tạo "đối xứng bắt buộc" cần người viết đọc lại.
  signals:
    regex:
    - (?s)(?:[^\n]{240,420}\n{1,3}){4,}
  why_it_matters: Đoạn đều nhau là dấu vết của khuôn bài luận năm đoạn, nhưng đây chỉ là heuristic và
    một dàn bài chỉn chu cũng cho kết quả tương tự.
  rewrite_strategy:
  - Đọc lại toàn bài và chỉ tách hoặc gộp đoạn ở nơi cấu trúc ý thật sự cần thay đổi.
  - Cho phép một đoạn rất ngắn khi ý đó đáng được đứng riêng.
  bad_examples:
  - text: |
      Nhóm nhận yêu cầu vào sáng thứ Hai và ghi nhận ngay vào hệ thống theo dõi nội bộ để mọi thành viên cùng nhìn thấy trạng thái công việc, kèm tên người phụ trách và hạn xử lý dự kiến của từng bước trong quy trình đã thống nhất từ đầu quý. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Nhóm kiểm tra dữ liệu vào buổi trưa cùng ngày và đối chiếu với bản sao lưu gần nhất để bảo đảm không có bản ghi nào bị thiếu, đồng thời ghi lại số bản ghi đã đối chiếu và các trường hợp lệch để người duyệt xem lại sau. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Nhóm gửi kết quả vào cuối ngày kèm ghi chú về các trường hợp ngoại lệ đã gặp khi đối chiếu, nêu rõ nguyên nhân của từng trường hợp và cách xử lý đã áp dụng để khách hàng nắm được diễn biến mà không phải hỏi lại nhóm. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Nhóm lưu biên bản sau cuộc họp và đóng yêu cầu khi khách hàng xác nhận kết quả đúng với mong đợi ban đầu, sau đó chuyển hồ sơ sang thư mục lưu trữ theo quy ước đặt tên mà bộ phận vận hành đã ban hành trước đó. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.
    reason: Bốn đoạn gần bằng nhau về độ dài và cùng một khuôn câu.
  - text: |
      Sản phẩm được giới thiệu lần đầu vào tháng 3 cho một nhóm thử nghiệm gồm ba mươi tài khoản nội bộ, những người đã đồng ý ghi lại phản hồi hằng tuần theo một biểu mẫu chung do bộ phận sản phẩm chuẩn bị từ trước. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Đội phát triển sửa mười bảy lỗi trong tháng 4 và bổ sung hai tính năng mà nhóm thử nghiệm đã yêu cầu nhiều lần, gồm phần lọc theo trạng thái và phần xuất báo cáo ra tệp bảng tính cho công việc đối soát hằng tháng. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Bản phát hành chính thức diễn ra vào tháng 5 và mở cho toàn bộ khách hàng đang dùng gói dịch vụ tiêu chuẩn, kèm một tài liệu hướng dẫn ngắn và một buổi giới thiệu trực tuyến cho những người mới bắt đầu dùng. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.

      Báo cáo tổng kết được gửi vào tháng 6 và ghi lại toàn bộ số liệu sử dụng trong tám tuần đầu sau phát hành, gồm số tài khoản hoạt động mỗi tuần, số lượt xuất báo cáo và danh sách yêu cầu hỗ trợ đã tiếp nhận. Ghi chú này được lưu lại trong hệ thống theo dõi nội bộ.
    reason: Nhịp đoạn đều tăm tắp che mất mức quan trọng khác nhau giữa các mốc.
  good_examples:
  - mode: needs_author_decision
    text: Bốn đoạn đang có độ dài gần bằng nhau. Tác giả cần quyết định đoạn nào là ý chính để giữ dài
      và đoạn nào có thể rút thành một hai câu.
    reason: Nhịp đoạn thuộc quyền quyết định của tác giả, không sửa tự động.
  - mode: no_change
    text: Giữ nguyên khi đây là báo cáo theo mẫu, biên bản hoặc tài liệu quy trình có bố cục cố định.
    reason: Đối xứng có thể là yêu cầu của thể loại.
  exceptions:
  - Báo cáo theo mẫu, biên bản, hồ sơ hành chính hoặc tài liệu quy trình có bố cục cố định.
  - Tài liệu cho người mới đọc khi mỗi đoạn cố ý giữ cùng một dung lượng.
  false_positive_risk: high
  tags:
  - nhip-doan
  - doi-xung
  - heuristic
  min_occurrences: 1
- id: VI-HUM-S06
  name: markdown-qua-lieu
  skill: humanizer-vi
  category: structural
  finding_type: heuristic
  scope: document
  aggregation: density
  severity: low
  confidence: low
  summary: Lạm dụng in đậm, bullet phân cấp và dấu gạch ngang dài trong văn xuôi.
  signals:
    regex:
    - \*\*[^*\n]{1,60}\*\*
    - (?m)^\s{2,}[-*+]\s
    - —
  why_it_matters: Định dạng Markdown dày đặc là mặc định của mô hình chat; trong văn xuôi nó cắt vụn mạch
    đọc và thay chỗ cho câu chuyển ý.
  rewrite_strategy:
  - Chuyển các bullet ngắn thành câu văn khi chúng thật ra là một mạch lập luận.
  - Chỉ in đậm khi cần đánh dấu một thuật ngữ hoặc cảnh báo, không in đậm đầu mỗi dòng.
  - Thay dấu gạch ngang dài bằng dấu phẩy, dấu chấm hoặc ngoặc đơn tùy quan hệ giữa hai vế.
  bad_examples:
  - text: '**Hiệu năng** — hệ thống nhanh hơn. **Chi phí** — giảm 12%. **Bảo trì** — dễ hơn trước.'
    reason: In đậm đầu dòng cộng gạch ngang dài thay cho câu văn.
  - text: Dự án có ba trụ cột — **dữ liệu**, **quy trình** và **con người** — và mỗi trụ cột lại chia thành
      các nhánh nhỏ.
    reason: Hai dấu gạch ngang dài và ba cụm in đậm trong một câu.
  good_examples:
  - mode: clean_rewrite
    text: Hệ thống chạy nhanh hơn, chi phí giảm 12% và việc bảo trì dễ hơn trước.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  - mode: clean_rewrite
    text: Dự án có ba trụ cột là dữ liệu, quy trình và con người; mỗi trụ cột lại chia thành các nhánh
      nhỏ.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  exceptions:
  - Không áp dụng cho tài liệu kỹ thuật, README, changelog và tài liệu API, nơi Markdown là định dạng
    đúng.
  - Không áp dụng cho checklist, bảng thông số và nội dung slide, nơi bullet và in đậm là cấu trúc chức
    năng.
  - Giữ nguyên mọi định dạng nằm trong khối code hoặc trích dẫn nguyên văn.
  false_positive_risk: high
  tags:
  - markdown
  - dinh-dang
  - gach-ngang-dai
  min_occurrences: 5
- id: VI-HUM-S07
  name: chuoi-danh-hoa-viec-su
  skill: humanizer-vi
  category: structural
  finding_type: heuristic
  scope: sentence
  aggregation: count
  severity: medium
  confidence: medium
  summary: Nhiều danh hóa "việc", "sự", "một cách" chồng trong một câu, che mất động từ chính.
  signals:
    regex:
    - \b(?:việc|sự|một cách)\b[^.!?\n]{0,40}\b(?:việc|sự|một cách)\b
  why_it_matters: Danh hóa chồng lớp thường đến từ việc dịch các hậu tố -ing, -tion, -ly và làm câu dài
    ra mà hành động vẫn không rõ ai làm.
  rewrite_strategy:
  - Tìm hành động thật rồi đưa nó về làm động từ chính của câu.
  - Bỏ "một cách" khi tính từ đã đủ làm trạng ngữ.
  bad_examples:
  - text: Việc triển khai sự thay đổi cần được thực hiện một cách cẩn thận.
    reason: Ba lớp danh hóa trong một câu ngắn.
  - text: Sự cải thiện của việc quản lý dữ liệu diễn ra một cách chậm rãi.
    reason: Động từ chính bị đẩy thành danh từ.
  good_examples:
  - mode: clean_rewrite
    text: Cần triển khai thay đổi này cẩn thận.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  - mode: clean_rewrite
    text: Việc quản lý dữ liệu cải thiện chậm.
    reason: Giữ các dữ kiện đã có và chỉ sửa cấu trúc mục tiêu.
  exceptions:
  - Trong register học thuật, hành chính và pháp lý, danh hóa là cách diễn đạt hợp lệ và thường bắt buộc.
  - Từ "của" và "được" thừa cùng trật tự câu theo tiếng Anh thuộc translationese-cleaner-vi; pattern này
    không xử lý chúng.
  - Khi cụm danh hóa là tên một điều khoản, mục hoặc chỉ tiêu đã được định nghĩa.
  false_positive_risk: medium
  tags:
  - danh-hoa
  - dong-tu-yeu
  min_occurrences: 2
- id: VI-HUM-P01
  name: xung-ho-khong-nhat-quan
  skill: humanizer-vi
  category: pragmatic
  finding_type: warning
  scope: document
  aggregation: consistency
  severity: medium
  confidence: medium
  summary: Cách xưng hô đổi giữa chừng trong cùng một văn bản, lúc "tôi", lúc "chúng ta", lúc "bạn" hoặc
    "quý vị".
  signals:
    regex:
    - \b(?:tôi|chúng tôi|chúng ta|bạn|quý vị|quý khách|anh|chị)\b
  why_it_matters: Đây là dấu hiệu đặc thù tiếng Việt rõ nhất trong nghiên cứu; mô hình học từ dữ liệu
    trộn nhiều nguồn nên khó giữ một hệ xưng hô suốt bài, còn người Việt viết thật gần như không đổi giữa
    chừng.
  rewrite_strategy:
  - Chọn một hệ xưng hô đúng với quan hệ và register, rồi áp dụng nhất quán cho toàn văn bản.
  - Nếu không rõ nên chọn hệ nào, hỏi tác giả thay vì tự chuẩn hóa.
  bad_examples:
  - text: Chúng tôi gửi kèm báo giá. Bạn vui lòng phản hồi trước thứ Sáu. Quý vị có thể liên hệ tổng đài
      nếu cần hỗ trợ.
    reason: Ba hệ xưng hô khác nhau trong ba câu liền nhau.
  - text: Tôi sẽ trình bày quy trình. Chúng ta cùng xem bước đầu tiên. Bạn hãy làm theo hướng dẫn bên dưới.
    reason: Góc nhìn đổi từ "tôi" sang "chúng ta" rồi sang "bạn".
  good_examples:
  - mode: clean_rewrite
    text: Chúng tôi gửi kèm báo giá. Quý khách vui lòng phản hồi trước thứ Sáu và liên hệ tổng đài nếu
      cần hỗ trợ.
    reason: Giữ các dữ kiện đã có và chỉ thống nhất cách xưng hô.
  - mode: needs_author_decision
    text: Văn bản đang dùng lẫn "tôi", "chúng ta" và "bạn". Tác giả cần chọn một hệ xưng hô trước khi
      biên tập tiếp.
    reason: Cách xưng hô phụ thuộc quan hệ, không tự quyết thay tác giả.
  exceptions:
  - Khi văn bản có nhiều người nói hoặc trích dẫn, mỗi giọng giữ cách xưng hô riêng.
  - Trong biên bản, phỏng vấn và kịch bản hội thoại khi việc đổi xưng hô là do đổi người nói.
  false_positive_risk: medium
  tags:
  - xung-ho
  - register
  - nhat-quan
  min_occurrences: 2
- id: VI-HUM-P02
  name: ban-mac-dinh-calque-you
  skill: humanizer-vi
  category: pragmatic
  finding_type: heuristic
  scope: document
  aggregation: density
  severity: low
  confidence: low
  summary: Dùng "bạn" làm đại từ mặc định để dịch "you" ở register mà mình, anh, chị, em hoặc quý khách
    mới đúng.
  signals:
    regex:
    - \bbạn\b
  why_it_matters: Tiếng Việt chọn đại từ theo quan hệ và tuổi tác; "bạn" dùng đại trà là dấu vết dịch
    máy và làm giọng văn xa lạ trong giao tiếp đời thường.
  rewrite_strategy:
  - Xác định quan hệ và register, rồi chọn đại từ đúng thay vì để "bạn" cho mọi trường hợp.
  - Nếu không biết quan hệ, để tác giả quyết định thay vì tự đổi.
  bad_examples:
  - text: Chào bác, bạn có thể mang sổ khám tới quầy số 3 để bạn được hướng dẫn tiếp.
    reason: '"Bạn" lệch hẳn với cách gọi "bác" ở đầu câu.'
  - text: Kính gửi quý khách, bạn vui lòng cung cấp mã đơn hàng để bạn được hỗ trợ nhanh hơn.
    reason: '"Bạn" phá vỡ register chăm sóc khách hàng đang dùng "quý khách".'
  good_examples:
  - mode: clean_rewrite
    text: Chào bác, bác mang sổ khám tới quầy số 3 để được hướng dẫn tiếp.
    reason: Giữ các dữ kiện đã có và chỉ sửa cách xưng hô cho khớp.
  - mode: clean_rewrite
    text: Kính gửi quý khách, quý khách vui lòng cung cấp mã đơn hàng để được hỗ trợ nhanh hơn.
    reason: Giữ các dữ kiện đã có và chỉ sửa cách xưng hô cho khớp.
  exceptions:
  - Trong register mạng xã hội và blog hướng tới độc giả trẻ, "bạn" thường là lựa chọn đúng.
  - Trong hướng dẫn sản phẩm cho người dùng ẩn danh, "bạn" là cách gọi trung tính đã được chấp nhận.
  - Không đổi "quý khách" trong chăm sóc khách hàng sang giọng thân mật và ngược lại.
  false_positive_risk: high
  tags:
  - xung-ho
  - calque
  - ban
  min_occurrences: 3
- id: VI-HUM-P03
  name: thieu-tinh-thai-tu
  skill: humanizer-vi
  category: pragmatic
  finding_type: heuristic
  scope: document
  aggregation: density
  severity: low
  confidence: low
  summary: Văn nói hoặc hội thoại không có một tình thái từ nào; đây là pattern vắng mặt, tín hiệu nằm
    ở chỗ các trợ từ "nhé, nhỉ, à, ạ, thôi, mà" đều không xuất hiện.
  signals:
    exclude_phrases:
    - nhé
    - nhỉ
    - à
    - ạ
    - thôi
    - mà
  why_it_matters: Trợ từ tình thái là thứ làm câu tiếng Việt nghe như lời người nói; khi cả đoạn hội thoại
    không có từ nào trong nhóm này, văn bản đọc thô cứng như bản dịch. Vì là tín hiệu vắng mặt, chỉ đánh
    dấu khi mọi từ trong danh sách đều không xuất hiện.
  rewrite_strategy:
  - Thêm tình thái từ ở những câu thật sự là lời nói, đúng một hai chỗ, không rải đều.
  - Chọn trợ từ theo quan hệ, ví dụ "ạ" khi nói với người trên, "nhé" khi dặn dò ngang hàng.
  bad_examples:
  - text: 'Khách: Cho tôi hỏi đơn hàng đã gửi chưa. Nhân viên: Đơn hàng của bạn đã được gửi vào hôm qua.'
    reason: Hội thoại chăm sóc khách hàng không có một trợ từ tình thái nào.
  - text: 'Con đi học về rồi. Mẹ để cơm trong bếp. Con ăn trước đi.'
    reason: Đoạn thoại gia đình nghe như câu lệnh vì thiếu hẳn tình thái từ.
  good_examples:
  - mode: clean_rewrite
    text: 'Khách: Cho tôi hỏi đơn hàng đã gửi chưa ạ. Nhân viên: Dạ đơn hàng đã được gửi từ hôm qua ạ.'
    reason: Giữ nội dung và chỉ thêm trợ từ đúng với quan hệ.
  - mode: clean_rewrite
    text: 'Con đi học về rồi à. Mẹ để cơm trong bếp, con ăn trước nhé.'
    reason: Giữ nội dung và chỉ thêm trợ từ đúng với quan hệ.
  exceptions:
  - Chỉ áp dụng cho register văn nói, mạng xã hội và chăm sóc khách hàng.
  - Không bao giờ áp dụng cho register hành chính, pháp lý và chính sách, học thuật hoặc kỹ thuật; ở đó
    việc không có tình thái từ là đúng.
  - Không áp dụng cho tiêu đề, chú thích bảng, danh sách và trích dẫn nguyên văn.
  false_positive_risk: high
  tags:
  - tinh-thai-tu
  - khau-ngu
  - vang-mat
  min_occurrences: 1
- id: VI-HUM-P04
  name: thanh-ngu-vang-hoac-sai
  skill: humanizer-vi
  category: pragmatic
  finding_type: heuristic
  scope: document
  aggregation: single
  severity: low
  confidence: low
  summary: Văn bản đời thường không có thành ngữ hay tục ngữ bản địa nào, hoặc gắn thành ngữ vào bằng
    một câu dẫn khuôn mẫu.
  signals:
    regex:
    - \b(?:ông bà ta|người xưa|các cụ) (?:thường )?(?:có câu|dạy rằng|vẫn nói)\b
    exclude_phrases:
    - nước đến chân mới nhảy
    - có công mài sắt có ngày nên kim
    - tiền nào của nấy
    - đâu vào đấy
    - được voi đòi tiên
  why_it_matters: Mô hình hiếm khi dùng thành ngữ thuần Việt đúng chỗ, và khi dùng thì hay bọc trong một
    câu dẫn khuôn; cả hai đều làm văn bản mất chất bản địa.
  rewrite_strategy:
  - Nếu thêm thành ngữ, đặt thẳng vào câu thay vì mở bằng "ông bà ta có câu".
  - Kiểm tra nghĩa của thành ngữ trước khi dùng; sai nghĩa còn tệ hơn không dùng.
  - Chỉ thêm khi giọng văn thật sự cần, không rải cho đủ chỉ tiêu bản địa.
  bad_examples:
  - text: Ông bà ta có câu "có công mài sắt có ngày nên kim", vì vậy nhóm cần kiên trì với dự án này.
    reason: Câu dẫn khuôn mẫu bọc quanh thành ngữ.
  - text: Người xưa thường có câu "tiền nào của nấy", nên chúng ta hãy chọn gói rẻ nhất.
    reason: Thành ngữ bị dùng ngược nghĩa.
  good_examples:
  - mode: clean_rewrite
    text: Dự án này cần kiên trì, có công mài sắt có ngày nên kim.
    reason: Giữ các dữ kiện đã có và bỏ câu dẫn khuôn.
  - mode: review_comment
    text: '"Tiền nào của nấy" mang nghĩa giá rẻ đi kèm chất lượng thấp, ngược với đề xuất chọn gói rẻ
      nhất; cần bỏ hoặc đổi lập luận.'
    reason: Không tự đảo lập luận của tác giả khi thành ngữ bị dùng sai.
  exceptions:
  - Không áp dụng cho register hành chính, pháp lý, học thuật và kỹ thuật, nơi thành ngữ không phù hợp.
  - Không thêm thành ngữ vào văn bản dịch, tài liệu chuẩn hoặc nội dung đã được khách hàng duyệt.
  false_positive_risk: high
  tags:
  - thanh-ngu
  - ban-dia
  - giong-van
  min_occurrences: 1
